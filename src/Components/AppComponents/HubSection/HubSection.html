<div class="hub">
  <section class="hub__hero">
    <!-- Vocabulario Memphis: triángulos, squiggles, círculos y tramas. -->
    <div class="hub__shapes" aria-hidden="true">
      <span class="hub__shape hub__shape--tri"></span>
      <span class="hub__shape hub__shape--circle"></span>
      <span class="hub__shape hub__shape--dots"></span>
      <span class="hub__shape hub__shape--stripes"></span>
      <span class="hub__shape hub__shape--pill"></span>
      <svg class="hub__shape hub__shape--squiggle" viewBox="0 0 120 28" fill="none">
        <path d="M2 14c8-16 18 16 26 0s18 16 26 0 18 16 26 0 18 16 26 0"
              stroke="currentColor" stroke-width="4" stroke-linecap="round" />
      </svg>
      <svg class="hub__shape hub__shape--squiggle2" viewBox="0 0 120 28" fill="none">
        <path d="M2 14c8-16 18 16 26 0s18 16 26 0 18 16 26 0 18 16 26 0"
              stroke="currentColor" stroke-width="4" stroke-linecap="round" />
      </svg>
    </div>

    <div class="hub__hero-inner">
      <p class="hub__kicker hub__reveal" style="--d: 0ms">Papelería creativa</p>

      <h1 class="hub__wordmark hub__reveal" style="--d: 80ms">VKRAFTS</h1>

      <p class="hub__lede hub__reveal" style="--d: 180ms">
        Armá, pegá e imprimí tus propias cosas.
      </p>
    </div>
  </section>

  <div class="hub__grid" data-ref="grid"></div>
</div>
