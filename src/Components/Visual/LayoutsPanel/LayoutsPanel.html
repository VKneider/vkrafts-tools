<div class="layoutspanel">
  <div data-ref="drop"></div>
  <div class="layoutspanel__gallery-wrap" data-ref="gallery" hidden></div>
  <div class="layoutspanel__actions" data-ref="actions"></div>
  <div class="layoutspanel__group">
    <span class="layoutspanel__label">Tamaño de hoja</span>
    <div data-ref="page"></div>
  </div>
  <div class="layoutspanel__group">
    <span class="layoutspanel__label">Tamaño de producto</span>
    <div class="layoutspanel__products" data-ref="product"></div>
    <span class="layoutspanel__hint" data-ref="productHint"></span>
  </div>

  <div class="layoutspanel__group">
    <span class="layoutspanel__label">Plantilla</span>
    <div class="layoutspanel__tplpicker" data-ref="tplPicker"></div>
    <div class="layoutspanel__customgrid">
      <label>Columnas <input data-ref="customCols" type="number" min="1" max="12" step="1" /></label>
      <label>Filas <input data-ref="customRows" type="number" min="1" max="12" step="1" /></label>
      <button type="button" class="layoutspanel__mini-apply" data-ref="customGridApply">Aplicar</button>
    </div>
    <span class="layoutspanel__hint" data-ref="customGridHint"></span>
  </div>
  <div class="layoutspanel__group">
    <span class="layoutspanel__label">Márgenes</span>
    <div class="layoutspanel__preset" data-ref="preset"></div>
    <div class="layoutspanel__custommargins">
      <label>Margen (cm) <input data-ref="customMargin" type="number" min="0" max="5" step="0.1" /></label>
      <label>Separación (cm) <input data-ref="customGap" type="number" min="0" max="5" step="0.1" /></label>
      <button type="button" class="layoutspanel__mini-apply" data-ref="customMarginsApply">Aplicar</button>
    </div>
  </div>
  <div class="layoutspanel__group">
    <span class="layoutspanel__label">Ajuste de imagen</span>
    <div class="layoutspanel__fit" data-ref="fit"></div>
  </div>
  <div class="layoutspanel__group">
    <span class="layoutspanel__label">Zoom de la imagen</span>
    <div class="layoutspanel__crop" data-ref="crop"></div>
    <span class="layoutspanel__hint" data-ref="cropHint"></span>
  </div>
  <div class="layoutspanel__group">
    <span class="layoutspanel__label">Escala de imagen</span>
    <div class="layoutspanel__scale" data-ref="scale"></div>
  </div>
</div>
