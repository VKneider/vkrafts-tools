<div class="poolcard">
  <button type="button" class="poolcard__thumb"></button>

  <span class="poolcard__dot" aria-hidden="true"></span>

  <button type="button" class="poolcard__del" aria-label="Eliminar de la biblioteca">×</button>

  <div class="poolcard__qty">
    <button type="button" class="poolcard__qty-btn" data-step="-1" aria-label="Menos copias">−</button>
    <span class="poolcard__qty-value" aria-live="polite">1</span>
    <button type="button" class="poolcard__qty-btn" data-step="1" aria-label="Más copias">+</button>
  </div>
</div>
