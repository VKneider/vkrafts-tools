<div class="slice_slider_container">
  <div class="slice_slider_header">
    <span class="slice_slider_label" hidden></span>
    <output class="slice_slider_value" aria-hidden="true"></output>
  </div>
  <div class="slice_slider_control">
    <div class="slice_slider_track"><div class="slice_slider_fill"></div></div>
    <input type="range" class="slice_slider_input slice_slider_input--low" />
    <input type="range" class="slice_slider_input slice_slider_input--high" hidden />
  </div>
  <div class="slice_slider_marks" hidden></div>
</div>
